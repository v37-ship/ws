# Production file for the VPS (uses `docker compose -f docker-compose.vps.yml`).
# Differences from the dev file:
#   - No Caddy / Mailpit / published ports: Traefik (~/docker/portainer-traefik)
#     is the edge on 80/443, Postgres/Umami stay on the Docker network, and the
#     app is reachable on 127.0.0.1:8088 (loopback only, for admin/debug).
#   - Real SMTP comes from ${SMTP_*}; DATABASE_URL points at the compose network.
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: spa
      POSTGRES_DB: spa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    restart: unless-stopped
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spa:spa@postgres:5432/umami
      DATABASE_TYPE: postgresql
      # Same salt as dev so the restored admin login keeps working.
      HASH_SALT: dev-umami-salt-change-me
      # isbot false-positives on some real phone UAs (Android builds/carriers)
      # silently discard the visit (HTTP 200 `{"beep":"boop"}`, nothing saved).
      # Count everything; bots are noise, missing real customers is not.
      DISABLE_BOT_CHECK: "1"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.umami.loadbalancer.server.port=3000
      # Tracker + API paths stay outside BasicAuth. `/script.js` and
      # `/api/send` must work anonymously; the rest of `/api/*` cannot use
      # BasicAuth either — Umami's SPA sends its own `Authorization: Bearer`
      # token on every API call, and one header cannot carry both schemes.
      # Those endpoints are still protected by Umami's own auth.
      - traefik.http.routers.umami-tracker.rule=Host(`umami.wangga.biz.id`) && (PathPrefix(`/script.js`) || PathPrefix(`/api/`))
      - traefik.http.routers.umami-tracker.entrypoints=websecure
      - traefik.http.routers.umami-tracker.tls.certresolver=wangga
      - traefik.http.routers.umami-tracker.priority=100
      # Pages (dashboard UI, login screen, settings…) are gated by BasicAuth:
      # scanners and bots never reach Umami's own login form.
      - traefik.http.routers.umami.rule=Host(`umami.wangga.biz.id`) && !PathPrefix(`/script.js`) && !PathPrefix(`/api/`)
      - traefik.http.routers.umami.entrypoints=websecure
      - traefik.http.routers.umami.tls.certresolver=wangga
      - traefik.http.routers.umami.middlewares=umami-auth
      - traefik.http.routers.umami.priority=200
      - traefik.http.middlewares.umami-auth.basicauth.users=${UMAMI_BA_USER}:${UMAMI_BA_HASH}
      # First-party tracker: serve Umami's script + collector under the main
      # domain (https://wangga.biz.id/_u/script.js → /script.js). Ad blockers
      # (uBO et al.) drop third-party analytics hosts outright, so real phone
      # visitors never sent a beacon; a same-origin, non-signature path does
      # not match those lists. The tracker derives its collector from its own
      # script URL, so it posts to /_u/api/send automatically.
      - traefik.http.routers.umami-apex.rule=Host(`wangga.biz.id`) && PathPrefix(`/_u/`)
      - traefik.http.routers.umami-apex.entrypoints=websecure
      - traefik.http.routers.umami-apex.tls.certresolver=wangga
      - traefik.http.routers.umami-apex.priority=300
      - traefik.http.routers.umami-apex.service=umami
      - traefik.http.routers.umami-apex.middlewares=umami-strip
      - traefik.http.middlewares.umami-strip.stripprefix.prefixes=/_u

  # WhatsApp gateway (Evolution API v2.3, Baileys). Internal-only: no Traefik
  # labels, the app reaches it at http://evolution:8080. The loopback port is
  # for QR pairing/debug over an SSH tunnel — never publish it publicly.
  # Reuses the compose Postgres with its own `evolution` database (created by
  # docker/postgres-init on a fresh cluster, or manually on an existing one).
  evolution:
    restart: unless-stopped
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: "${WA_API_KEY:-}"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://spa:spa@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: wangga
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Inbound webhook is configured in phase 2 via /webhook/set (so the
      # shared-secret header is attached); the env-level global webhook stays
      # off until the handler exists.
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://app:8080/webhooks/evolution
      CONFIG_SESSION_PHONE_CLIENT: Wangga Spa
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances

  app:
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgres://spa:spa@postgres:5432/spa?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-halo@wangga.biz.id}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: admin@wangga.biz.id
      ADMIN_PASSWORD: unused-populated-db
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_CLIENT_KEY: ""
      MIDTRANS_IS_PRODUCTION: "false"
      UPLOAD_DIR: /app/uploads
      CONTACT_WHATSAPP: "628211347294"
      CONTACT_EMAIL: halo@wangga.biz.id
      CONTACT_ADDRESS: "Studio kayu putih No.32, Kayu Putih, Pulo Gadung, Jakarta Timur. 13260"
      CONTACT_HOURS: "Setiap Hari 11:00-21:00 WIB"
      CONTACT_MAPS_URL: "https://maps.app.goo.gl/s2qKbkLZicYDUeFB7"
      CONTACT_INSTAGRAM: "https://www.instagram.com/wanggababymomwoman/"
      CONTACT_TIKTOK: "https://www.tiktok.com/@wanggababymomwomenspa"
      CONTACT_FACEBOOK: "https://facebook.com/p/Wangga-Spa-61594094265276"
      ANALYTICS_URL: "${ANALYTICS_URL:-http://umami:3000}"
      ANALYTICS_SITE_ID: "${ANALYTICS_SITE_ID:-}"
      # WhatsApp outbound (see internal/service/wa.go). Mock mode until a
      # number is paired: messages are rendered + logged, never sent.
      WA_ENABLED: "${WA_ENABLED:-false}"
      WA_API_URL: "${WA_API_URL:-http://evolution:8080}"
      WA_API_KEY: "${WA_API_KEY:-}"
      WA_INSTANCE: "${WA_INSTANCE:-wangga}"
      WA_WEBHOOK_SECRET: "${WA_WEBHOOK_SECRET:-}"
      WA_REMINDER_HOUR: "${WA_REMINDER_HOUR:-18}"
      WA_SEND_RATE: "${WA_SEND_RATE:-1s}"
      GOOGLE_REVIEW_URL: "${GOOGLE_REVIEW_URL:-}"
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - default
      - proxy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.wangga.loadbalancer.server.port=8080
      - traefik.http.routers.wangga.rule=Host(`wangga.biz.id`)
      - traefik.http.routers.wangga.entrypoints=websecure
      - traefik.http.routers.wangga.tls.certresolver=wangga

networks:
  proxy:
    external: true

volumes:
  pgdata:
  evolution_instances:
