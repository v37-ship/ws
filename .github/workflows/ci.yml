name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spa
          POSTGRES_PASSWORD: spa
          POSTGRES_DB: spa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U spa
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test (incl. template parse)
        run: go test -race -count=1 ./...

      - name: Vet integration tests (build-tagged)
        run: go vet -tags=integration ./...

      - name: Integration tests (Postgres)
        env:
          TEST_DATABASE_URL: postgres://spa:spa@localhost:5432/spa_test
          CI: "true"
        run: go test -tags=integration -race -count=1 -p 1 ./...

      - name: Build
        run: go build ./...

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t spa-booking:ci .

      - name: Validate compose config
        run: docker compose config --quiet
