services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: spa
      POSTGRES_DB: spa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visitor analytics (Umami, MIT). Reuses the postgres server above with its
  # own `umami` database. Dashboard on :8030 (localhost-only like Mailpit).
  umami:
    restart: unless-stopped
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spa:spa@postgres:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: dev-umami-salt-change-me
    ports:
      - "8030:3000"

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # WhatsApp gateway (Evolution API v2.3, Baileys) for local testing. It reuses
  # the compose Postgres with its own `evolution` database (created by
  # docker/postgres-init on a fresh volume). The app talks to it at
  # http://evolution:8080; the manager is on http://localhost:8081.
  evolution:
    restart: unless-stopped
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: "${WA_API_KEY:-dev-wa-key}"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://spa:spa@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: wangga
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://app:8080/webhooks/evolution
      CONFIG_SESSION_PHONE_CLIENT: Wangga Spa
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR
    ports:
      - "8081:8080"
    volumes:
      - evolution_instances:/evolution/instances

  app:
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:-http://localhost:8088}
      DATABASE_URL: postgres://spa:spa@postgres:5432/spa?sslmode=disable
      SESSION_SECRET: dev-session-secret-change-me
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-halo@wangga.biz.id}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: admin@wangga.biz.id
      ADMIN_PASSWORD: admin12345
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_CLIENT_KEY: ""
      MIDTRANS_IS_PRODUCTION: "false"
      UPLOAD_DIR: /app/uploads
      CONTACT_WHATSAPP: "628211347294"
      CONTACT_EMAIL: halo@wangga.biz.id
      CONTACT_ADDRESS: "Studio kayu putih No.32, Kayu Putih, Pulo Gadung, Jakarta Timur. 13260"
      CONTACT_HOURS: "Setiap Hari 11:00-21:00 WIB"
      CONTACT_MAPS_URL: "https://maps.app.goo.gl/s2qKbkLZicYDUeFB7"
      CONTACT_INSTAGRAM: "https://www.instagram.com/wanggababymomwoman/"
      CONTACT_TIKTOK: "https://www.tiktok.com/@wanggababymomwomenspa"
      CONTACT_FACEBOOK: "https://facebook.com/p/Wangga-Spa-61594094265276"
      ANALYTICS_URL: "${ANALYTICS_URL:-}"
      ANALYTICS_SITE_ID: "${ANALYTICS_SITE_ID:-}"
      WA_ENABLED: "${WA_ENABLED:-false}"
      WA_API_URL: "${WA_API_URL:-http://evolution:8080}"
      WA_API_KEY: "${WA_API_KEY:-dev-wa-key}"
      WA_INSTANCE: "${WA_INSTANCE:-wangga}"
      WA_WEBHOOK_SECRET: "${WA_WEBHOOK_SECRET:-dev-webhook-secret}"
      WA_REMINDER_HOUR: "${WA_REMINDER_HOUR:-18}"
      WA_SEND_RATE: "${WA_SEND_RATE:-1s}"
    ports:
      - "8088:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    restart: unless-stopped
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8089:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
  evolution_instances:
