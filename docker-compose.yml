services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: spa
      POSTGRES_DB: spa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visitor analytics (Umami, MIT). Reuses the postgres server above with its
  # own `umami` database. Dashboard on :8030 (localhost-only like Mailpit).
  umami:
    restart: unless-stopped
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spa:spa@postgres:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: dev-umami-salt-change-me
    ports:
      - "8030:3000"

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:-http://localhost:8088}
      DATABASE_URL: postgres://spa:spa@postgres:5432/spa?sslmode=disable
      SESSION_SECRET: dev-session-secret-change-me
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-halo@wangga.biz.id}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: admin@wangga.biz.id
      ADMIN_PASSWORD: admin12345
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_CLIENT_KEY: ""
      MIDTRANS_IS_PRODUCTION: "false"
      UPLOAD_DIR: /app/uploads
      CONTACT_WHATSAPP: "628211347294"
      CONTACT_EMAIL: halo@wangga.biz.id
      CONTACT_ADDRESS: "Studio kayu putih No.32, Kayu Putih, Pulo Gadung, Jakarta Timur. 13260"
      CONTACT_HOURS: "Setiap Hari 11:00-21:00 WIB"
      CONTACT_MAPS_URL: "https://maps.app.goo.gl/s2qKbkLZicYDUeFB7"
      CONTACT_INSTAGRAM: "https://www.instagram.com/wanggababymomwoman/"
      ANALYTICS_URL: "${ANALYTICS_URL:-}"
      ANALYTICS_SITE_ID: "${ANALYTICS_SITE_ID:-}"
    ports:
      - "8088:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    restart: unless-stopped
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8089:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
