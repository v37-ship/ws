services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: spa
      POSTGRES_DB: spa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      BASE_URL: http://localhost:8088
      DATABASE_URL: postgres://spa:spa@postgres:5432/spa?sslmode=disable
      SESSION_SECRET: dev-session-secret-change-me
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: bookings@spa.local
      ADMIN_EMAIL: admin@spa.local
      ADMIN_PASSWORD: admin12345
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_CLIENT_KEY: ""
      MIDTRANS_IS_PRODUCTION: "false"
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8089:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
