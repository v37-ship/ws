{{define "admin_locations.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locations — Admin</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800" rel="stylesheet">
</head>
<body>
  {{template "header" .}}
  <main class="stack">
    <nav class="admin-nav"><a href="/admin">Admin</a></nav>
    <h1>Locations</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form class="panel stack" method="post" action="/admin/locations">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Name <input name="name" required></label>
      <label>Address <input name="address"></label>
      <label>City <input name="city"></label>
      <label>Timezone <input name="timezone" value="Asia/Jakarta"></label>
      <button class="btn" type="submit">Add location</button>
    </form>
    <div class="panel">
      <table class="table">
        <thead><tr><th>Name</th><th>City</th><th>Timezone</th></tr></thead>
        <tbody>
        {{range .Locations}}
          <tr><td>{{.Name}}</td><td>{{.City}}</td><td>{{.Timezone}}</td></tr>
        {{end}}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
{{end}}
