{{define "admin_services.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services — Admin</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800" rel="stylesheet">
</head>
<body>
  {{template "header" .}}
  <main class="stack">
    <nav class="admin-nav"><a href="/admin">Admin</a></nav>
    <h1>Services</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form class="panel stack" method="post" action="/admin/services">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Location
        <select name="location_id" required>
          {{range .Locations}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
        </select>
      </label>
      <label>Name <input name="name" required></label>
      <label>Description <textarea name="description" rows="2"></textarea></label>
      <label>Duration (min) <input type="number" name="duration_min" value="60" min="15" required></label>
      <label>Price (IDR) <input type="number" name="price_idr" value="250000" min="0" required></label>
      <button class="btn" type="submit">Add service</button>
    </form>
    <div class="panel">
      <table class="table">
        <thead><tr><th>Name</th><th>Duration</th><th>Price</th></tr></thead>
        <tbody>
        {{range .Services}}
          <tr><td>{{.Name}}</td><td>{{.DurationMin}} min</td><td>{{formatIDR .PriceIDR}}</td></tr>
        {{end}}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
{{end}}
