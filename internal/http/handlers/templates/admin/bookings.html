{{define "admin_bookings.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings — Admin</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800" rel="stylesheet">
</head>
<body>
  {{template "header" .}}
  <main class="stack">
    <nav class="admin-nav"><a href="/admin">Admin</a></nav>
    <h1>Upcoming bookings</h1>
    <div class="panel">
      <table class="table">
        <thead><tr><th>When</th><th>Customer</th><th>Service</th><th>Staff</th><th>Status</th></tr></thead>
        <tbody>
        {{range .Bookings}}
          <tr>
            <td>{{formatTime .StartAt "Mon 02 Jan 15:04"}}</td>
            <td>{{.CustomerName}}</td>
            <td>{{.ServiceName}}</td>
            <td>{{.StaffName}}</td>
            <td><span class="badge {{.Status}}">{{.Status}}</span></td>
          </tr>
        {{else}}
          <tr><td colspan="5" class="muted">No bookings</td></tr>
        {{end}}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
{{end}}
