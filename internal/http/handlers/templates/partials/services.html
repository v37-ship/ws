{{define "services_partial.html"}}
<label>Service
  <select name="service_id" id="service_id" required
    hx-get="/book/staff" hx-target="#staff-wrap"
    hx-include="#location_id,#service_id">
    <option value="">Select service</option>
    {{range .Services}}
    <option value="{{.ID}}" {{if eq $.ServiceID .ID.String}}selected{{end}}>{{.Name}} — {{formatIDR .PriceIDR}} ({{.DurationMin}} min)</option>
    {{end}}
  </select>
</label>
{{end}}
