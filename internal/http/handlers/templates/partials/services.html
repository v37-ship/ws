{{define "services_partial.html"}}
<label>{{t .Lang "svc2.service"}}
  <select name="service_id" id="service_id" required
    hx-get="/book/staff" hx-target="#staff-wrap"
    hx-include="#location_id,#service_id">
    <option value="">{{t .Lang "svc2.select"}}</option>
    {{range .Services}}
    <option value="{{.ID}}" {{if eq $.ServiceID .ID.String}}selected{{end}}>{{.DisplayName $.Lang}} — {{formatIDR .PriceIDR}} ({{.DurationMin}} {{t $.Lang "unit.min"}})</option>
    {{end}}
  </select>
</label>
{{end}}
