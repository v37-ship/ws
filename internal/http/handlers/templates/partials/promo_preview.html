{{define "promo_preview.html"}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>
{{else if .Quote.Code}}
<input type="hidden" name="promo_code" value="{{.Quote.Code}}">
<dl class="review" data-discount="{{.Quote.Discount}}">
  <div><dt>{{t .Lang "promo.disc"}} ({{.Quote.Code}})</dt><dd class="promo-save">−{{formatIDR .Quote.Discount}}</dd></div>
</dl>
{{end}}
{{end}}
