{{define "slots_partial.html"}}
<div class="stack">
  <strong>{{t .Lang "slots.title"}}</strong>
  {{if .SlotsError}}<p class="error" role="alert">{{.SlotsError}}</p>{{end}}
  {{if .Slots}}
  <div class="slot-grid" role="group" aria-label="Available time slots">
    {{range .Slots}}
    <button type="button" class="slot" aria-pressed="false"
      data-start="{{.StartAt.Format "2006-01-02T15:04:05Z07:00"}}" data-staff="{{.StaffID}}"
      @click="pick($el.dataset.start, $el.dataset.staff)">
      {{formatTime .StartAt "15:04"}}
    </button>
    {{end}}
  </div>
  <p class="muted">{{t .Lang "slots.hint"}}</p>
  {{else}}
  <p class="muted">{{t .Lang "slots.empty"}}</p>
  {{end}}
</div>
{{end}}
