{{define "pay_status.html"}}
{{if eq (printf "%s" .Booking.Status) "confirmed"}}
  <p class="ok">{{t .Lang "pay.ok"}}</p>
  <a class="btn" href="/bookings">{{t .Lang "pay.view"}}</a>
{{else if eq (printf "%s" .Booking.Status) "pending_payment"}}
  <p class="muted">{{t .Lang "pay.wait"}}</p>
{{else}}
  <p class="error">{{t .Lang "pay.status"}} {{.Booking.Status}}</p>
{{end}}
{{end}}
