{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
/* Theme ships with the HTML (never a cached JS file) so the toggle works
   on first paint even with stale assets. Stored choice wins; default is
   system, which leaves data-theme unset for the CSS media query. */
window.__wanggaTheme = {
  order: ["light", "dark", "system"],
  icons: { light: "☀", dark: "🌙", system: "◐" },
  labels: { light: "Light", dark: "Dark", system: "Auto" },
  get: function () {
    try {
      var t = localStorage.getItem("wangga-theme");
      return this.order.indexOf(t) >= 0 ? t : "system";
    } catch (e) { return "system"; }
  },
  paint: function (t) {
    var b = document.getElementById("theme-btn");
    if (!b) return;
    var i = document.getElementById("theme-icon");
    var l = document.getElementById("theme-label");
    if (i) i.textContent = this.icons[t];
    if (l) l.textContent = this.labels[t];
    b.setAttribute("aria-label", "Theme: " + this.labels[t] + " (tap to change)");
    b.title = "Theme: " + this.labels[t];
  },
  apply: function (t) {
    if (t === "system") {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", t);
    }
    try { localStorage.setItem("wangga-theme", t); } catch (e) {}
    this.paint(t);
  },
  cycle: function () {
    this.apply(this.order[(this.order.indexOf(this.get()) + 1) % this.order.length]);
    return false;
  }
};
(function () {
  try {
    var t = window.__wanggaTheme.get();
    if (t !== "system") document.documentElement.setAttribute("data-theme", t);
    var paint = function () { window.__wanggaTheme.paint(window.__wanggaTheme.get()); };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", paint);
    } else { paint(); }
  } catch (e) {}
})();
function __wanggaThemeCycle() { try { return window.__wanggaTheme.cycle(); } catch (e) { return false; } }
/* Sidebar collapse ships the same way: stored choice (full/mini) paints
   before first render so the rail never flashes expanded on load. */
window.__wanggaSide = {
  get: function () {
    try { return localStorage.getItem("wangga-side") === "mini" ? "mini" : "full"; }
    catch (e) { return "full"; }
  },
  apply: function (v) {
    if (v === "mini") { document.documentElement.setAttribute("data-side", "mini"); }
    else { document.documentElement.removeAttribute("data-side"); }
    try { localStorage.setItem("wangga-side", v); } catch (e) {}
    var b = document.getElementById("side-toggle");
    if (b) {
      var mini = v === "mini";
      b.setAttribute("aria-expanded", mini ? "false" : "true");
      var tt = mini ? b.getAttribute("data-t-expand") : b.getAttribute("data-t-collapse");
      if (tt) b.title = tt;
    }
  },
  toggle: function () {
    this.apply(this.get() === "mini" ? "full" : "mini");
    return false;
  }
};
(function () {
  try {
    if (window.__wanggaSide.get() === "mini") document.documentElement.setAttribute("data-side", "mini");
    var paint = function () { window.__wanggaSide.apply(window.__wanggaSide.get()); };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", paint);
    } else { paint(); }
  } catch (e) {}
})();
function __wanggaSideToggle() { try { return window.__wanggaSide.toggle(); } catch (e) { return false; } }
/* Desktop sticky sidebar must clear the sticky header (variable height):
   measure at load/resize, clear below desktop width (drawer has own rules). */
function __wanggaSideOffset() {
  try {
    var side = document.getElementById("portal-side");
    if (!side) return;
    if (window.matchMedia("(min-width:1024px)").matches) {
      var h = document.querySelector(".site-header");
      side.style.top = ((h ? h.offsetHeight : 0) + 16) + "px";
      side.style.maxHeight = "calc(100vh - " + ((h ? h.offsetHeight : 0) + 32) + "px)";
    } else {
      side.style.top = "";
      side.style.maxHeight = "";
    }
  } catch (e) {}
}
document.addEventListener("DOMContentLoaded", __wanggaSideOffset);
window.addEventListener("resize", __wanggaSideOffset);
/* Mobile drawer: transient per page load (always starts closed). */
window.__wanggaDrawer = {
  open: function () {
    document.documentElement.setAttribute("data-drawer", "open");
    document.body.style.overflow = "hidden";
    var b = document.querySelector(".nav-toggle");
    if (b) b.setAttribute("aria-expanded", "true");
    return false;
  },
  close: function () {
    document.documentElement.removeAttribute("data-drawer");
    document.body.style.overflow = "";
    var b = document.querySelector(".nav-toggle");
    if (b) b.setAttribute("aria-expanded", "false");
    return false;
  },
  toggle: function () {
    if (document.documentElement.getAttribute("data-drawer") === "open") return this.close();
    return this.open();
  }
};
function __wanggaDrawerToggle() { try { return window.__wanggaDrawer.toggle(); } catch (e) { return false; } }
function __wanggaDrawerClose() { try { return window.__wanggaDrawer.close(); } catch (e) { return false; } }
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { try { window.__wanggaDrawer.close(); } catch (err) {} }
});
/* Homepage hero: default is the compact look with text overlaid.
   Scrolling UP on purpose (back toward the top after scrolling down)
   expands to a fullscreen image-only moment; scrolling DOWN returns to
   default. The armed flag distinguishes fresh loads (stay compact) from
   returns to the top (expand). Skipped under prefers-reduced-motion. */
function __wanggaHeroInit() {
  try {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var hero = document.getElementById("hero");
    if (!hero || hero.getAttribute("data-hero-init") === "1") return;
    hero.setAttribute("data-hero-init", "1");
    var photos = hero.querySelectorAll(".hero-photo");
    var lastY = window.scrollY || 0;
    var armed = lastY > 120;
    var ticking = false;
    var paint = function () {
      ticking = false;
      var y = window.scrollY || 0;
      if (y > 120) armed = true;
      if (y < lastY && armed && y < 400) hero.classList.add("hero-big");
      else if (y > lastY) hero.classList.remove("hero-big");
      lastY = y;
      var shift = Math.min(y * 0.12, 120);
      for (var k = 0; k < photos.length; k++) {
        photos[k].style.transform = "translateY(" + shift + "px) scale(1.08)";
      }
    };
    var onScroll = function () {
      if (!ticking) { ticking = true; requestAnimationFrame(paint); }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    paint();
  } catch (e) {}
}
try {
  __wanggaHeroInit();
  var __heroTries = 0;
  var __heroPoll = setInterval(function () {
    try {
      var h = document.getElementById("hero");
      if ((h && h.getAttribute("data-hero-init") === "1") || ++__heroTries > 200) {
        clearInterval(__heroPoll);
        return;
      }
      __wanggaHeroInit();
    } catch (e) { clearInterval(__heroPoll); }
  }, 120);
} catch (e) {}
</script>
