{{define "header"}}
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark">Wangga</span>
    <span class="brand-sub">Baby &amp; Mom Spa</span>
  </a>
  <nav class="nav">
    <a href="/book">Book</a>
    {{if .User}}
      {{if .User.Role.IsStaff}}
        <a href="/portal" style="color:var(--accent-deep); font-weight:800;">🏥 Staff Portal</a>
      {{else}}
        <a href="/bookings">My bookings</a>
      {{end}}
      {{if eq (printf "%s" .User.Role) "admin"}}
        <a href="/admin">Admin</a>
      {{end}}
      <span class="muted" style="font-size:0.85rem;">{{.User.FullName}} ({{.User.Role}})</span>
      <form method="post" action="/logout" style="display:inline">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button class="linkish" type="submit">Log out</button>
      </form>
    {{else}}
      <a href="/login">Log in</a>
      <a href="/register">Register</a>
    {{end}}
  </nav>
</header>
{{end}}
