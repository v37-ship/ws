{{define "register.html"}}
<!DOCTYPE html>
<html lang="{{if .Lang}}{{.Lang}}{{else}}id{{end}}">
<head>
  <title>{{t .Lang "auth.reg_btn"}} — Wangga Spa Baby, Mom, & Woman</title>
  {{template "head" .}}
</head>
<body>
  {{template "header" .}}
  {{template "toast-region" .}}
  <main>
    <section class="auth-shell stack">
      <h1 class="page-title">{{t .Lang "auth.reg_title"}}</h1>
      <p class="muted">{{t .Lang "auth.reg_sub"}}</p>
      {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
      <form class="panel stack" method="post" action="/register">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <label>{{t .Lang "auth.name"}} <input name="full_name" required value="{{.FullName}}"></label>
        <label>{{t .Lang "auth.email"}} <input type="email" name="email" required value="{{.Email}}"></label>
        <label>{{t .Lang "auth.phone"}} <input name="phone" value="{{.Phone}}"></label>
        <label>{{t .Lang "auth.pass"}} <input type="password" name="password" required minlength="8"></label>
        <button class="btn" type="submit">{{t .Lang "auth.reg_btn"}}</button>
      </form>
    </section>
  </main>
  {{template "footer" .}}
</body>
</html>
{{end}}
