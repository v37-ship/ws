{{define "tv_invalid.html"}}
<!DOCTYPE html>
<html lang="{{if .Lang}}{{.Lang}}{{else}}id{{end}}">
<head>
  <title>{{t .Lang "tv.inv.title"}} — Wangga Spa Baby, Mom, & Woman</title>
  {{template "head" .}}
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="tv-invalid" style="min-height:100vh; display:grid; place-items:center; padding:1.5rem;">
    <div class="panel stack" style="max-width:420px; text-align:center;">
      {{icon "x-circle"}}
      <h1 class="page-title">{{t .Lang "tv.inv.title"}}</h1>
      <p class="muted">{{t .Lang "tv.inv.body"}}</p>
      <p class="muted">{{t .Lang "tv.inv.hint"}}</p>
    </div>
  </main>
</body>
</html>
{{end}}
