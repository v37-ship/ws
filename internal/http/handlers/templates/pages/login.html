{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Wangga: Baby &amp; Mom Spa</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800" rel="stylesheet">
</head>
<body>
  {{template "header" .}}
  <main>
    <section class="auth-shell stack">
      <h1 class="page-title">Welcome back</h1>
      <p class="muted">Log in to book at Wangga: Baby &amp; Mom Spa.</p>
      {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
      <form class="panel stack" method="post" action="/login">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <label>Email <input type="email" name="email" required value="{{.Email}}"></label>
        <label>Password <input type="password" name="password" required minlength="8"></label>
        <button class="btn" type="submit">Log in</button>
      </form>
      <p class="muted">No account? <a href="/register">Register</a></p>
    </section>
  </main>
</body>
</html>
{{end}}
